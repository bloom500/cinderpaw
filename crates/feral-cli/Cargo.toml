[package]
name = "feral-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "feral-cli"
path = "src/main.rs"

[dependencies]
feral-core = { path = "../feral-core", default-features = false }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
# `feral chat` TUI: stream /runtime/chat SSE + read /runtime/status.
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
futures-util = "0.3"
# CLI surface (Slice 4b): subcommands, --json/--no-color/-V, shell completion.
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

[features]
default = ["inference"]
inference        = ["feral-core/inference"]
inference-cuda   = ["feral-core/inference-cuda"]
inference-vulkan = ["feral-core/inference-vulkan"]
inference-metal  = ["feral-core/inference-metal"]
whisper          = ["feral-core/whisper"]