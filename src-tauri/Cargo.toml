[package]
name = "feral"
version = "0.2.1"
description = "Feral — local AI desktop runtime"
authors = ["Feral Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
specta = "=2.0.0-rc.25"
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"

# MCP client — official Rust SDK (Model Context Protocol)
rmcp = { version = "1.7", features = ["client", "transport-child-process"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-stream = "0.3"

# HTTP server (Ollama-compatible API)
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# HTTP client (tool calls, HF downloads)
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }

# Inference — llama.cpp bindings (CPU by default; add feature "inference-vulkan" for GPU)
llama-cpp-2 = { version = "0.1", default-features = false, optional = true }

# Utilities
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = "0.32"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"
# OS-native secret storage for BYOK API keys (V6): DPAPI/Credential Manager on
# Windows, Keychain on macOS, Secret Service (libsecret) on Linux. Platform
# backends are target-gated inside the crate, so only the host's backend builds.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
log = "0.4"
once_cell = "1"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
encoding_rs = "0.8"
urlencoding = "2"

# Chat attachment text extraction (PDF + OOXML/ODF containers)
pdf-extract = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }

[features]
default = ["inference"]
inference = ["dep:llama-cpp-2"]
inference-vulkan = ["dep:llama-cpp-2", "llama-cpp-2/vulkan"]

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
