[package]
name = "feral"
version = "0.1.0"
description = "Feral — local AI desktop runtime"
authors = ["Feral Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-stream = "0.3"

# HTTP server (Ollama-compatible API)
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# HTTP client (tool calls, HF downloads)
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }

# Inference — llama.cpp bindings
llama-cpp-2 = { version = "0.1", default-features = false, features = ["vulkan"], optional = true }

# Model downloads from HuggingFace
hf-hub = { version = "0.3", features = ["tokio"], default-features = false }

# Utilities
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = "0.32"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"
log = "0.4"
once_cell = "1"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
urlencoding = "2"

[features]
default = []
# Real inference requires C++ toolchain + Vulkan SDK; enable explicitly.
inference = ["llama-cpp-2"]
