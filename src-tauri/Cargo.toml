[package]
name = "feral"
version = "2026.7.13"
description = "Feral — local AI desktop runtime"
authors = ["Feral Contributors"]
license = "BUSL-1.1"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
specta = "=2.0.0-rc.25"
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-stream = "0.3"

# HTTP server (Ollama-compatible API)
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# HTTP client (tool calls, HF downloads)
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "rustls-tls"], default-features = false }

# Feral Runtime (host-agnostic): inference, models, API, RSI substrate,
# settings, paths, tools, byok, perf, gpu, transcription.
feral-core = { path = "../crates/feral-core", default-features = false }

# Utilities
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = "0.32"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"
# SHA-256 for the hash-chained SandboxBounds audit log.
# The agent's tool audit (audit-log.ts) uses node:crypto; the bounds audit
# here uses the same algorithm but a separate chain so a tamper on one side
# cannot mask a tamper on the other.
sha2 = "0.10"
# git2 (libgit2 bindings) for the RSI git substrate at ~/.feral/rsi/.git/.
# Vendored so we don't depend on a system libgit2 install — the spec requires
# "fără dependență de git instalat pe sistem". The C build is heavy; only the
# rsi module pulls it in.
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }
# OS-native secret storage for BYOK API keys (V6): DPAPI/Credential Manager on
# Windows, Keychain on macOS, Secret Service (libsecret) on Linux. Platform
# backends are target-gated inside the crate, so only the host's backend builds.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
log = "0.4"
once_cell = "1"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
encoding_rs = "0.8"
urlencoding = "2"
# CSPRNG for the at-rest DB field key (H-1). Already in the tree transitively
# (uuid/rand); declared directly so key generation uses the OS RNG explicitly.
getrandom = "0.2"

# Chat attachment text extraction (PDF + OOXML/ODF containers)
pdf-extract = "0.12"
zip = { version = "2", default-features = false, features = ["deflate"] }

[features]
default = ["inference"]
# CPU-only baseline (works everywhere; slow for larger models).
inference = ["feral-core/inference"]
# GPU backends — additive on top of `inference`. Pick at most ONE per build
# (enabling two GPU features simultaneously is untested and likely produces
# duplicate symbols in llama-cpp-sys-2). CI selects one per platform:
#   Windows/Linux NVIDIA → inference-cuda     (needs CUDA Toolkit 12.x + nvcc)
#   Windows/Linux AMD/Intel → inference-vulkan (needs the Vulkan SDK at build time)
#   macOS                → inference-metal    (Metal ships with Xcode; no extra SDK)
# A GPU build still falls back to CPU at runtime if GPU init fails (see
# inference.rs::backend::load), so a missing/broken driver degrades gracefully.
inference-cuda   = ["feral-core/inference-cuda"]
inference-vulkan = ["feral-core/inference-vulkan"]
inference-metal  = ["feral-core/inference-metal"]
whisper          = ["feral-core/whisper"]

# Desktop control (OS accessibility tree). Windows-only for now — UIA via the
# `windows` crate. macOS (AX) and Linux are compiled stubs in desktop_control.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

# No [profile.*] here: Cargo only honours profiles from the workspace root and
# warns on every build about the ones it is ignoring. The release profile lives
# in the root Cargo.toml.
