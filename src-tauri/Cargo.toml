[package]
name = "cinderpaw"
version = "2026.8.11"
description = "Cinderpaw — local AI desktop runtime"
authors = ["Cinderpaw Contributors"]
license = "BUSL-1.1"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
# Native message box for the one failure that happens before a window exists
# (the home-folder migration). Already present as tauri-plugin-dialog's own dep.
# Feature set copied from tauri-plugin-dialog's own rfd dependency. Default
# features would add xdg-portal, and rfd refuses to build with gtk3 and
# xdg-portal both on: the plugin turns gtk3 on, features unify, and the
# Linux build died in rfd's build script. Windows and macOS never saw it.
rfd = { version = "0.16", default-features = false, features = ["common-controls-v6"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
specta = "=2.0.0-rc.25"
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-stream = "0.3"

# HTTP server (Ollama-compatible API)
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# HTTP client (tool calls, HF downloads)
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "rustls-tls"], default-features = false }

# Cinderpaw Runtime (host-agnostic): inference, models, API, RSI substrate,
# settings, paths, tools, byok, perf, gpu, transcription.
cinderpaw-core = { path = "../crates/cinderpaw-core", default-features = false }

# Utilities
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = "0.32"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"
# SHA-256 for the hash-chained SandboxBounds audit log.
# The agent's tool audit (audit-log.ts) uses node:crypto; the bounds audit
# here uses the same algorithm but a separate chain so a tamper on one side
# cannot mask a tamper on the other.
sha2 = "0.10"
# git2 (libgit2 bindings) for the RSI git substrate at ~/.cinderpaw/rsi/.git/.
# Vendored so we don't depend on a system libgit2 install — the spec requires
# "fără dependență de git instalat pe sistem". The C build is heavy; only the
# rsi module pulls it in.
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }
# OS-native secret storage for BYOK API keys (V6): DPAPI/Credential Manager on
# Windows, Keychain on macOS, Secret Service (libsecret) on Linux. Platform
# backends are target-gated inside the crate, so only the host's backend builds.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
log = "0.4"
once_cell = "1"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
encoding_rs = "0.8"
urlencoding = "2"
# CSPRNG for the at-rest DB field key (H-1). Already in the tree transitively
# (uuid/rand); declared directly so key generation uses the OS RNG explicitly.
getrandom = "0.2"

# Chat attachment text extraction (PDF + OOXML/ODF containers)
pdf-extract = "0.12"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-deep-link = "2.4.10"
tauri-plugin-single-instance = { version = "2.4.4", features = ["deep-link"] }
url = "2"

[features]
# `piper` is on by default because it is the voice the product should answer in:
# on device, no key, no expiring tier. It costs a native ONNX Runtime download
# and an espeak-ng C build at compile time (cmake, already required by
# llama.cpp), so a platform whose toolchain cannot do that drops this one flag
# and the picker reports Piper as unavailable instead of offering a mute engine.
# `whisper` is NOT here, and it cannot be until something upstream changes.
#
# It looks like an oversight: Settings has an on-device transcription model
# picker and the STT card lists "local", while `transcribe_audio` returns
# `voice-unavailable` in every build we ship — a control that can only fail for
# anyone who did not compile their own. It was turned on for exactly that reason
# on 2026-08-23 and CI rejected it within the hour:
#
#   LNK2005: ggml_abort already defined in libwhisper_rs_sys...
#   error: linking with `link.exe` failed: exit code: 1169
#
# `whisper-rs-sys` and `llama-cpp-sys-2` each vendor their OWN copy of ggml, so
# enabling both puts two definitions of every ggml symbol in one binary. This is
# not a flag to flip; it needs the two crates to share one ggml build, or whisper
# to run out-of-process. Until then the honest fix is the UI not offering local
# transcription, NOT this line.
default = ["inference", "piper", "kokoro"]
# CPU-only baseline (works everywhere; slow for larger models).
inference = ["cinderpaw-core/inference"]
# GPU backends — additive on top of `inference`. Pick at most ONE per build
# (enabling two GPU features simultaneously is untested and likely produces
# duplicate symbols in llama-cpp-sys-2). CI selects one per platform:
#   Windows/Linux NVIDIA → inference-cuda     (needs CUDA Toolkit 12.x + nvcc)
#   Windows/Linux AMD/Intel → inference-vulkan (needs the Vulkan SDK at build time)
#   macOS                → inference-metal    (Metal ships with Xcode; no extra SDK)
# A GPU build still falls back to CPU at runtime if GPU init fails (see
# inference.rs::backend::load), so a missing/broken driver degrades gracefully.
inference-cuda   = ["cinderpaw-core/inference-cuda"]
inference-vulkan = ["cinderpaw-core/inference-vulkan"]
inference-metal  = ["cinderpaw-core/inference-metal"]
whisper          = ["cinderpaw-core/whisper"]
# On-device text-to-speech. Both engines ride the same two native pieces —
# ONNX Runtime and espeak-ng — so the second one is a model, not a toolchain.
piper            = ["cinderpaw-core/piper"]
kokoro           = ["cinderpaw-core/kokoro"]

# Desktop control (OS accessibility tree). Windows-only for now — UIA via the
# `windows` crate. macOS (AX) and Linux are compiled stubs in desktop_control.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

# No [profile.*] here: Cargo only honours profiles from the workspace root and
# warns on every build about the ones it is ignoring. The release profile lives
# in the root Cargo.toml.
