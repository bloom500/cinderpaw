[workspace]
# D2 fix: removed the legacy `frontend` Trunk/Rust member. The active
# frontend is `frontend-react/`, which is built by Tauri (tauri.conf.json
# beforeDevCommand / beforeBuildCommand) and never enters the Rust
# workspace.
# Faza 4.5 Slice 2: `crates/cinderpaw-cli` joins the workspace as the headless
# gateway binary (Slice 2/Task 4). The dev binary is `cinderpaw-cli` because the
# desktop dev binary already claims `target/debug/cinderpaw.exe` (src-tauri
# package name `cinderpaw`). The user-facing name `cinderpaw` is applied at
# packaging time (installer alias/rename) per spec D6a.
members = ["src-tauri", "crates/cinderpaw-core", "crates/cinderpaw-cli"]
exclude = ["third_party/wry"]
resolver = "2"

# wry 0.55.1 with ONE change per platform (webview2, wkwebview, webkitgtk):
# `window.ipc` is defined `configurable: true`. Upstream defines it locked in
# every page, so any site with its own global `ipc` dies on load: Google Sheets
# threw "Identifier 'ipc' has already been declared" in the built-in browser
# and never opened (11 Oct). Still locked upstream in wry 0.57.0. When Tauri
# moves to another wry, cargo warns "patch was not used": re-copy that version
# here with the same change, or drop this if upstream fixed it.
[patch.crates-io]
wry = { path = "third_party/wry" }

[workspace.package]
version = "2026.10.25"
edition = "2021"
license = "Apache-2.0"
authors = ["Cinderpaw Contributors"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# Native C/C++ math kernels are unusably slow when compiled without
# optimizations: a debug build made whisper.cpp transcription take *minutes*
# and pegged the CPU (the perceived "RAM lag"). Build just these heavy native
# crates with -O3 even in dev (their build scripts read OPT_LEVEL, so this also
# flips their CMake/cc compile to Release), while our own Rust stays debug for
# fast iteration. whisper-rs-sys bundles ggml, so this covers the STT kernels;
# llama-cpp-2 is the LLM inference kernels.
[profile.dev.package.whisper-rs-sys]
opt-level = 3

[profile.dev.package.llama-cpp-sys-2]
opt-level = 3

# Dev builds spent much of their time writing debug info for ~900 dependencies
# nobody steps into. Our own crates keep full debug info, so their panics and
# backtraces still name the file and line. Release builds are not affected.
[profile.dev.package."*"]
debug = false
