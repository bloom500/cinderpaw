name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build, sign & publish
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout FeralLocalAI
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        working-directory: frontend-react
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Feral Agent sidecar binary
        shell: pwsh
        run: |
          # Feral Agent is vendored in this monorepo at FeralAgent/ — it is the
          # single source of truth. (The old standalone github.com/bloom500/feral-agent
          # repo is deprecated; building from it caused release fixes to diverge
          # from the in-repo copy.) Build a single executable with
          # `bun build --compile` and copy it into the Tauri externalBin location
          # expected by src-tauri/tauri.conf.json
          # (`binaries/feral-agent-x86_64-pc-windows-msvc.exe`).
          $agentDir = Join-Path $env:GITHUB_WORKSPACE "FeralAgent"
          Push-Location $agentDir
          bun install
          bun run build
          Pop-Location

          $built = Join-Path $agentDir "dist\feral-agent.exe"
          if (-not (Test-Path $built)) {
            Write-Error "Feral Agent binary not produced — bun build step failed"
            exit 1
          }

          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item $built src-tauri/binaries/feral-agent-x86_64-pc-windows-msvc.exe -Force
          Write-Host "Feral Agent sidecar binary built successfully"

      - name: Extract release notes from CHANGELOG
        id: changelog
        shell: pwsh
        run: |
          $content = Get-Content CHANGELOG.md -Raw
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $escaped = [regex]::Escape($version)
          $pattern = "(?m)^## v$escaped\s*\r?\n([\s\S]*?)(?=\r?\n^## v|\Z)"
          $match = [regex]::Match($content, $pattern)
          if ($match.Success) {
            $notes = $match.Groups[1].Value.Trim()
            $delimiter = "CHANGELOG_EOF_$(Get-Random)"
            "NOTES<<$delimiter" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
            $notes          | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
            "$delimiter"    | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Release notes extracted for v$version"
          } else {
            Write-Warning "No CHANGELOG entry for v$version — release body will be empty"
            "NOTES=" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Build, sign and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Secrets required for updater artifacts (latest.json + .sig).
          # Add them in Settings → Secrets and variables → Actions.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Feral ${{ github.ref_name }}"
          releaseBody: ${{ steps.changelog.outputs.NOTES }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Uploads the bundles AND latest.json (updater manifest) to the release.
          includeUpdaterJson: true
