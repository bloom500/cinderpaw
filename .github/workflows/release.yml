name: Release

on:
  push:
    tags:
      - "v*"
  # Rebuild the opt-in CUDA assets for a tag that is ALREADY released, without
  # re-cutting the release. The CUDA job only uploads its own suffixed bundles
  # and never touches latest.json, so this cannot disturb a working release —
  # which is the point: a missing optional asset is not worth rebuilding four
  # platforms that already shipped.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build CUDA assets for (e.g. v2026.07.13)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build, sign & publish (${{ matrix.name }})
    # Only a tag push cuts a release. A manual run is for the CUDA job below.
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    # SignPath Foundation signing (H-3) — FREE for open-source. Job-level so the
    # gated Windows steps can check whether signing is configured. Absent ⇒ every
    # Windows step below is skipped and the bundle ships unsigned, exactly as
    # before. Add SIGNPATH_API_TOKEN (secret) + the SIGNPATH_* vars after your
    # signpath.org/apply project is approved.
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows builds the Vulkan backend with the Ninja generator, NOT the
          # Visual Studio generator (see the "Setup MSVC + Ninja" step below).
          # Under the VS generator, llama.cpp's vulkan-shaders-gen ExternalProject
          # sub-build fails in its MSBuild custom install step ("cannot find batch
          # label VCEnd" → missing cmake_install.cmake), panicking the cmake
          # crate — reproduced identically on both VS 2022 and VS 2026, so it's
          # the generator, not the toolchain version. Pinned to windows-2022 for
          # a stable image. (CPU/Linux/macOS are unaffected.)
          - name: Windows x64
            os: windows-2022
            features: inference-vulkan,piper,kokoro
          - name: macOS Apple Silicon
            os: macos-latest
            features: inference-metal,piper,kokoro
          # macOS Intel is CROSS-COMPILED from the Apple Silicon runner.
          #
          # It used to say `macos-14` — which is an Apple Silicon image, as is
          # `macos-latest`. So the "Intel" job cheerfully rebuilt ARM under the
          # same artifact names, reported success, and Intel Macs got no dmg and
          # no `darwin-x86_64` in latest.json: they could neither install nor
          # update.
          #
          # `macos-13` is the last x86_64 image on paper, but it no longer gets
          # provisioned — a job pinned to it sat queued for 90 minutes and never
          # picked up a runner. So there is no native Intel builder left, and
          # `--target x86_64-apple-darwin` from the ARM runner is the only way to
          # produce this artifact at all.
          #
          # CPU-only on purpose: llama.cpp's Metal backend targets Apple GPUs, so
          # enabling it for an Intel Mac is a coin flip. `inference` is the
          # default CPU feature — real inference, just not GPU-accelerated, which
          # is what these machines were going to fall back to anyway. It also
          # keeps the cross-compile down to one C++ toolchain instead of two.
          - name: macOS Intel
            os: macos-latest
            features: inference,piper,kokoro
            target: x86_64-apple-darwin
          # No `piper`/`kokoro` here, and not by oversight: their shared ONNX
          # Runtime prebuilt needs glibc 2.38, which Ubuntu 22.04 does not have.
          # Adding them back would trade every 22.04 and Debian 12 user for a
          # local voice. On-device TTS is therefore Windows/macOS only for now;
          # the hosted engines still work on Linux and the picker says which is
          # which. See the comment on `default` in src-tauri/Cargo.toml.
          - name: Linux x64
            os: ubuntu-22.04
            features: inference-vulkan

    steps:
      - name: Checkout Cinderpaw
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # bindgen (llama-cpp-sys-2 build dep) needs libclang at compile time —
          # the Ubuntu runner image only ships clang (compiler), not the
          # libclang runtime that bindgen links against.
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl \
            wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev cmake \
            libfuse2 \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            libclang-dev clang
          # libclang-dev on Ubuntu 22.04 puts libclang.so.14 in
          # /usr/lib/llvm-14/lib/, NOT in /usr/lib/x86_64-linux-gnu/ where
          # bindgen looks by default. Point it at the right path so
          # bindgen doesn't panic at compile time. Mirrors the macOS step.
          echo "LIBCLANG_PATH=/usr/lib/llvm-14/lib" >> "$GITHUB_ENV"

      # Vulkan SDK — required to COMPILE the llama.cpp Vulkan backend
      # (inference-vulkan). Provides headers, libvulkan, and glslc (the shader
      # compiler the build invokes). macOS uses Metal instead and needs no SDK.
      # NOTE: these GPU build steps are new and unvalidated on CI — the first
      # tagged build may need the SDK install tweaked.
      - name: Install Vulkan SDK (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc > /dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list \
            https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true

      # Build the Vulkan backend with Ninja instead of the Visual Studio
      # generator (which breaks llama.cpp's vulkan-shaders-gen ExternalProject —
      # see the matrix comment). setup-msvc-dev loads the MSVC toolchain
      # environment (cl.exe, INCLUDE/LIB) into GITHUB_ENV so cmake + Ninja can
      # find the compiler in later steps; Ninja itself is preinstalled on the
      # windows runner image. CMAKE_GENERATOR=Ninja is read by the cmake crate
      # that llama-cpp-sys-2 drives. Both are Windows-only; Linux/macOS keep
      # their default generators.
      - name: Setup MSVC dev environment (Windows)
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v3.0.2
        with:
          arch: x64

      - name: Force Ninja generator for the Vulkan build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV

      # macOS runners ship Xcode CLT (clang) but no `libclang.dylib`, and
      # bindgen (used by llama-cpp-sys-2 to generate Rust bindings for the
      # llama.cpp C API) panics at startup if it can't find libclang. Install
      # LLVM via Homebrew and point bindgen at it. The runner image already
      # has Homebrew preinstalled; this is cheap (~30s on a warm cache).
      # No `shell:` is set, so this runs under bash on macOS — `$GITHUB_ENV`
      # is the bash-style env var, NOT the PowerShell `$env:GITHUB_ENV`
      # (a previous version of this step used the PowerShell syntax and
      # silently failed to export the env var, so bindgen still panicked).
      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          echo "PATH=$(brew --prefix llvm)/bin:$PATH" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        working-directory: frontend-react
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Only the macOS Intel entry declares a target; everything else builds
      # natively and skips this.
      - name: Add cross-compile target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Cinderpaw Agent is vendored in this monorepo at CinderpawAgent/ — the single
      # source of truth. The actual compile + copy into src-tauri/binaries/
      # happens in tauri.conf.json's beforeBuildCommand
      # (scripts/build-sidecar.mjs), which derives the correct
      # cinderpaw-agent-<target-triple> name for the host platform. We only need
      # the dependencies installed first.
      - name: Install Cinderpaw Agent sidecar dependencies
        working-directory: CinderpawAgent
        run: bun install

      - name: Extract release notes from CHANGELOG
        id: changelog
        shell: pwsh
        run: |
          # CalVer tags are vYYYY.MM.DD (padded); CHANGELOG headers are
          # `## YYYY.MM.DD` (no `v`). Find the matching header, then capture
          # everything up to the next `## ` header (or EOF).
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $content = Get-Content CHANGELOG.md -Raw
          $lines = $content -split "`r?`n"
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^##\s+$([regex]::Escape($version))\s*$") {
              $start = $i + 1
              break
            }
          }
          if ($start -lt 0) {
            Write-Warning "No CHANGELOG entry for v$version — release body will be empty"
            "NOTES=" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          $end = $lines.Count
          for ($i = $start; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^##\s+") { $end = $i; break }
          }
          $notes = ($lines[$start..($end - 1)] -join "`n").Trim()
          $delimiter = "CHANGELOG_EOF_$(Get-Random)"
          "NOTES<<$delimiter" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          $notes               | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "$delimiter"         | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release notes extracted for v$version ($($notes.Length) chars, $end-$start lines)"

      - name: Build, sign and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # llama.cpp (llama-cpp-sys-2) uses std::filesystem, which needs a
          # macOS 10.15+ deployment target — Tauri's default of 10.13 makes
          # clang reject std::filesystem::path during the CMake build.
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          # The sidecar is an externalBin: Tauri looks it up by TARGET triple,
          # and it has to be able to run on the target machine. Both of those
          # break on a cross build unless the build script is told what it is
          # building for, so tell it. Empty for native builds, which keep
          # deriving the triple from the host.
          CINDERPAW_SIDECAR_TARGET: ${{ matrix.target }}
          # linuxdeploy's strip pass chokes on the already-stripped release
          # binary (panic=abort + lto + strip in Cargo.toml) and kills the
          # AppImage bundling with an opaque "failed to run linuxdeploy".
          # Stripping is redundant here anyway.
          NO_STRIP: "true"
          # Secrets required for updater artifacts (latest.json + .sig).
          # Add them in Settings → Secrets and variables → Actions.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Cinderpaw ${{ github.ref_name }}"
          releaseBody: ${{ steps.changelog.outputs.NOTES }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Per-platform GPU backend (Vulkan on Win/Linux, Metal on macOS).
          # `--features` is additive on top of the default `inference` (CPU),
          # so the build gets CPU + the platform GPU backend; inference.rs falls
          # back to CPU at runtime if GPU init fails.
          # `--target` is appended only for the entry that declares one (macOS
          # Intel, cross-compiled from the ARM runner). Everything else builds
          # for the host.
          args: >-
            --features ${{ matrix.features }}
            ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          # Uploads the bundles AND latest.json (updater manifest) to the
          # release. With a matrix, tauri-action merges each platform into
          # the same latest.json on the shared release.
          includeUpdaterJson: true

      # ── Authenticode signing via SignPath Foundation (FREE for OSS) ──────────
      # Every step here is gated on SIGNPATH_API_TOKEN, so until the project is
      # approved at signpath.org/apply and the secret + vars below are set, these
      # steps are SKIPPED and the release ships unsigned exactly as before.
      #
      # Flow: collect the just-built installers → submit to SignPath → it returns
      # Authenticode-signed copies → regenerate the updater signature over the
      # SIGNED bytes and clobber the release assets, so both manual downloads and
      # auto-update see a signed, verifiable installer.
      #
      # After approval add: secret SIGNPATH_API_TOKEN, and repo variables
      # SIGNPATH_ORGANIZATION_ID / SIGNPATH_PROJECT_SLUG / SIGNPATH_POLICY_SLUG.
      - name: Collect Windows installers
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          $dir = "signpath-in"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Get-ChildItem -Recurse -Path src-tauri/target -Include *-setup.exe,*.msi |
            Where-Object { $_.FullName -match 'bundle' } |
            ForEach-Object { Copy-Item $_.FullName $dir }
          if (-not (Get-ChildItem $dir)) { Write-Error "no installers found to sign"; exit 1 }
          Get-ChildItem $dir | ForEach-Object { Write-Host "to sign: $($_.Name)" }

      - name: Upload unsigned installers (for SignPath)
        id: unsigned
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: cinderpaw-windows-unsigned
          path: signpath-in/*

      - name: Sign with SignPath Foundation
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signpath-out

      # Auto-update verifies the .sig against the downloaded bytes, so after
      # SignPath changes the installer we MUST regenerate the updater signature
      # and replace the release assets. (This Windows-updater interaction is the
      # one piece to confirm on the first real signed release.)
      - name: Re-sign updater manifest over the signed installer
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $signed = Get-ChildItem -Recurse -Path signpath-out -Include *-setup.exe | Select-Object -First 1
          if (-not $signed) { Write-Error "no signed NSIS installer returned by SignPath"; exit 1 }

          # 1) New updater signature over the SIGNED bytes.
          bunx --bun @tauri-apps/cli@2 signer sign `
            --private-key "$env:TAURI_SIGNING_PRIVATE_KEY" `
            --password "$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD" `
            "$($signed.FullName)"
          $newSig = (Get-Content "$($signed.FullName).sig" -Raw).Trim()

          # 2) Patch latest.json's windows entry (same filename ⇒ url unchanged).
          gh release download $tag --pattern latest.json --dir . --clobber
          $json = Get-Content latest.json -Raw | ConvertFrom-Json
          $json.platforms.'windows-x86_64'.signature = $newSig
          $json | ConvertTo-Json -Depth 10 | Set-Content latest.json -Encoding utf8

          # 3) Replace the release assets with the signed installer + manifest.
          gh release upload $tag "$($signed.FullName)" latest.json --clobber
          $msi = Get-ChildItem -Recurse -Path signpath-out -Include *.msi | Select-Object -First 1
          if ($msi) { gh release upload $tag "$($msi.FullName)" --clobber }

  # ── NVIDIA / CUDA build (opt-in download, not the default) ──────────────────
  #
  # Why a SEPARATE job and a separate asset instead of another matrix entry:
  #
  #   * One binary carries exactly one GPU backend (see Cargo.toml — enabling two
  #     produces duplicate symbols in llama-cpp-sys-2). So CUDA cannot simply be
  #     "added" to the Windows/Linux build.
  #   * A CUDA-compiled binary links cudart/cublas and needs the NVIDIA runtime
  #     present. Shipping it as THE Windows build would break every user without
  #     an NVIDIA card. Vulkan therefore stays the default for everyone (it runs
  #     on NVIDIA too — just leaves some performance on the table), and this is
  #     the faster download for people who know they have an NVIDIA GPU.
  #   * A second matrix entry would also collide on the release: identical bundle
  #     filenames, and tauri-action would merge a second entry into latest.json,
  #     pointing the auto-updater at a build most users cannot run.
  #
  # Consequence, deliberately: these assets are NOT in latest.json, so the CUDA
  # build does not auto-update. It is an opt-in download, re-downloaded on each
  # release. Wiring a second updater channel is the follow-up if demand appears.
  cuda:
    name: NVIDIA CUDA build (${{ matrix.name }})
    needs: release            # the GitHub release must exist before we upload to it
    # On a manual run the `release` job is skipped, and a skipped dependency
    # would skip this one too — so accept that case explicitly.
    if: >-
      always() && (
        github.event_name == 'workflow_dispatch' ||
        needs.release.result == 'success'
      )
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # a CUDA failure must never sink the main release
      matrix:
        include:
          # Sub-package cherry-picking works on Windows and does NOT work on
          # Linux, which is why the Linux CUDA asset had never once been built.
          # The action prefixes every name it is given with `cuda-`, but on
          # Linux the cuBLAS packages are `libcublas-12-6` / `libcublas-dev-12-6`
          # — no `cuda-` prefix. So `cublas` resolves to `cuda-cublas-12-6` and
          # `libcublas` to `cuda-libcublas-12-6`, and apt has never heard of
          # either. cuBLAS is simply not expressible through that list, and
          # llama.cpp's CUDA backend does not build without it.
          #
          # `[]` means "install the whole toolkit", which is the only way to get
          # cuBLAS on Linux here. It is a bigger download, and the action caches
          # it. Windows keeps the narrow list, where it works and where
          # `visual_studio_integration` (Windows-only) is actually needed.
          - name: Windows x64
            os: windows-2022
            asset_glob: "*-setup.exe"
            cuda_subpackages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust", "visual_studio_integration"]'
          - name: Linux x64
            os: ubuntu-22.04
            asset_glob: "*.AppImage"
            cuda_subpackages: "[]"

    steps:
      # Build the SOURCE AT THE TAG, not whatever main happens to be. On a tag
      # push these are the same commit; on a manual re-run they are not, and
      # shipping a CUDA asset built from newer code than the release it is
      # attached to would be a quiet lie.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            cmake libfuse2 libclang-dev clang \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
          echo "LIBCLANG_PATH=/usr/lib/llvm-14/lib" >> "$GITHUB_ENV"

      # CUDA Toolkit — provides nvcc, cudart and cuBLAS headers/libs that
      # llama.cpp's GGML_CUDA backend compiles against. ~3 GB, so it is cached.
      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: "12.6.0"
          method: "network"
          # Only what llama.cpp links; the full toolkit is needlessly large.
          # Per-OS (see the matrix): the MSVC integration package is Windows-only.
          sub-packages: ${{ matrix.cuda_subpackages }}

      - name: Setup MSVC dev environment (Windows)
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v3.0.2
        with:
          arch: x64

      # llama-cpp-sys-2's build.rs forwards every CMAKE_* env var to CMake, so
      # this pins the GPU architectures the fat binary is compiled for. Without
      # it the build targets the RUNNER's GPU — and CI runners have none.
      #   75 Turing (RTX 20xx) · 80/86 Ampere (RTX 30xx) · 89 Ada (RTX 40xx,
      #   including the 4050/4060/4070) · 90 Hopper.
      # Blackwell (RTX 50xx, sm_120) needs CUDA 12.8+; those cards run the
      # Vulkan build until this is bumped.
      - name: Pin CUDA architectures
        shell: bash
        run: echo "CMAKE_CUDA_ARCHITECTURES=75;80;86;89;90" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        working-directory: frontend-react
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: cuda

      - name: Install Cinderpaw Agent sidecar dependencies
        working-directory: CinderpawAgent
        run: bun install

      # No tagName/releaseId ⇒ tauri-action BUILDS but does not upload, so it
      # cannot clobber the Vulkan assets or touch latest.json. We rename and
      # upload the bundles ourselves below.
      - name: Build (CUDA)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: "true"
        with:
          # piper/kokoro on Windows only — see the Linux note in the matrix
          # above; the same ONNX Runtime glibc floor applies to this job.
          args: --features inference-cuda${{ runner.os == 'Windows' && ',piper,kokoro' || '' }}

      # Suffix the bundles so they sit next to the Vulkan ones on the release
      # instead of overwriting them, and so the filename tells the user what it
      # is before they download 100+ MB.
      - name: Upload CUDA bundles to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          shopt -s globstar nullglob
          found=0
          for f in src-tauri/target/**/bundle/**/${{ matrix.asset_glob }}; do
            base="$(basename "$f")"
            ext="${base##*.}"
            stem="${base%.*}"
            out="$(dirname "$f")/${stem}-nvidia-cuda.${ext}"
            mv "$f" "$out"
            echo "uploading $(basename "$out")"
            gh release upload "$tag" "$out" --clobber
            found=1
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no CUDA bundle matched ${{ matrix.asset_glob }}"
            exit 1
          fi
