name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build, sign & publish
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout FeralLocalAI
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        working-directory: frontend-react
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Feral Agent sidecar binary
        shell: pwsh
        run: |
          # Feral Agent is a separate repo (github.com/bloom500/feral-agent).
          # We clone it next to the FeralLocalAI checkout, build a single
          # executable with `bun build --compile`, and copy it into the
          # Tauri externalBin location expected by src-tauri/tauri.conf.json
          # (`binaries/feral-agent-x86_64-pc-windows-msvc.exe`).
          $agentRepo = "$env:GITHUB_WORKSPACE\..\feral-agent"
          if (-not (Test-Path $agentRepo)) {
            New-Item -ItemType Directory -Force -Path (Split-Path $agentRepo) | Out-Null
            git clone https://github.com/bloom500/feral-agent.git $agentRepo
          }
          Push-Location $agentRepo
          bun install
          bun run build
          Pop-Location

          $built = Join-Path $agentRepo "dist\feral-agent.exe"
          if (-not (Test-Path $built)) {
            Write-Error "Feral Agent binary not produced — bun build step failed"
            exit 1
          }

          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item $built src-tauri/binaries/feral-agent-x86_64-pc-windows-msvc.exe -Force
          Write-Host "Feral Agent sidecar binary built successfully"

      - name: Build, sign and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Secrets required for updater artifacts (latest.json + .sig).
          # Add them in Settings → Secrets and variables → Actions.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Feral ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Uploads the bundles AND latest.json (updater manifest) to the release.
          includeUpdaterJson: true
