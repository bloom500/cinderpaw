name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }} / ${{ matrix.step.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        step:
          - name: cinderpaw-agent
            workdir: CinderpawAgent
            install: bun install
            typecheck: bun run typecheck
            test: bun test
          - name: frontend-react
            workdir: frontend-react
            install: npm ci
            typecheck: npm run typecheck
            test: npm test -- --run

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: ${{ matrix.step.workdir }}
        run: ${{ matrix.step.install }}

      - name: Typecheck
        working-directory: ${{ matrix.step.workdir }}
        run: ${{ matrix.step.typecheck }}

      # CINDERPAW_E2E turns on the fail-closed safety suites — journal tampering,
      # the watchdog, module quarantine, governance. They are the tests that
      # demonstrate the rails hold, and they were gated behind a variable no
      # workflow set, so they had never run here once. They pass; nothing would
      # have said so on the day they stopped.
      #
      # Set for both matrix legs rather than only the agent: an env var that
      # applies to a step the other leg does not have is free, and a condition
      # here is one more thing to get wrong later.
      #
      # CINDERPAW_FMS_BENCH turns on the Fractal Memory scale suites. They were
      # gated behind a variable nothing set, so the 10k/100k upsert and recall
      # timings never ran here — which is how a hot-path change that made recall
      # several times slower could land without a single red mark. Benchmarks
      # that never run are not benchmarks; they are a folder.
      - name: Test
        working-directory: ${{ matrix.step.workdir }}
        run: ${{ matrix.step.test }}
        env:
          CINDERPAW_E2E: "1"
          CINDERPAW_FMS_BENCH: "1"

  # The Go TUI (`cinderpaw chat`, the guided setup, the connector wizard) — 16k
  # lines with its own suite, built by install.sh and bundled with the desktop
  # app, and until now compiled by nothing in CI. A break shipped silently.
  #
  # Ubuntu only: the code is plain Go with no cgo and no platform branches, so a
  # second OS would buy a longer queue rather than more coverage. Revisit the
  # day something here starts calling into the OS.
  tui:
    name: tui (go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum

      - name: Build
        working-directory: tui
        run: go build ./...

      - name: Test
        working-directory: tui
        run: go test ./...

  # The Rust half (src-tauri + crates/*) used to be compiled for the first time
  # by the tagged release build itself — a compile error there meant deleting
  # and re-pushing the tag. This job builds and tests it on every push instead.
  #
  # Default features only: no `inference-*`, so no Vulkan/CUDA SDK and no
  # llama.cpp compile. The GPU backends stay release-only.
  #
  # src-tauri's build script resolves `frontendDist` and `externalBin`, so the
  # frontend bundle and the sidecar binary must exist before cargo runs — the
  # same prerequisites release.yml installs, minus the bundling.
  rust:
    name: rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # On-device TTS (piper/kokoro) is Windows/macOS only: both ride one
          # ONNX Runtime whose Linux prebuilt needs glibc 2.38, and 22.04 has
          # 2.35. Windows is where they ship, so Windows is where they are
          # compiled and tested. See src-tauri/Cargo.toml's `default`.
          - os: ubuntu-22.04
            features: ""
          - os: windows-latest
            features: "--features cinderpaw/piper,cinderpaw/kokoro"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl \
            wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev cmake libclang-dev clang

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2

      - name: Install sidecar dependencies
        working-directory: CinderpawAgent
        run: bun install

      # Produces src-tauri/binaries/cinderpaw-agent-<target-triple> (externalBin).
      - name: Build sidecar
        working-directory: src-tauri
        run: node scripts/build-sidecar.mjs

      # Produces frontend-react/dist (frontendDist).
      - name: Build frontend
        working-directory: frontend-react
        run: npm ci && npm run build

      - name: cargo test
        run: cargo test --workspace ${{ matrix.features }}

  # The headless/server build (`cargo build -p cinderpaw-cli --no-default-features`)
  # compiles the cfg(not(feature = "inference")) stubs that no other job
  # touches — this check exists because that path shipped broken once
  # (E0271 in the stream_chat stub). Cheap: no llama.cpp, no GUI deps.
  headless-cli:
    name: headless-cli (no-default-features)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libdbus-1-dev cmake

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2

      - name: cargo check (headless CLI)
        run: cargo check --release -p cinderpaw-cli --no-default-features

  # Dependency vulnerability scanning (M-3). Fails the build on known
  # advisories so a vulnerable transitive dep can't slip into a release.
  security-audit:
    name: security-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Prebuilt cargo-audit binary (no source compile) for the RustSec DB.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Rust deps — fails on RustSec vulnerability advisories. Uses the
      # committed Cargo.lock at the workspace root.
      #
      # Waivers live in `.cargo/audit.toml`, each with the reason it is
      # unreachable in this app and the upstream event that makes it removable —
      # same standard as the npm gate below. cargo audit has no --show-ignored
      # and drops waived advisories from its output entirely, so they are echoed
      # back here: a waiver nobody sees again is how an allowlist rots into a
      # severity threshold.
      - name: cargo audit
        run: |
          cargo audit
          echo "::notice::Waived Rust advisories — reason and deletion trigger in .cargo/audit.toml"
          sed -n '/^\[advisories\]/,$p' .cargo/audit.toml \
            | grep -o 'RUSTSEC-[0-9][0-9-]*' | sort -u | sed 's/^/  waived: /'

      # Frontend (npm) — gate on high+ severity only to avoid dev-only noise.
      # Wrapped so an advisory whose only npm remediation is a DOWNGRADE into
      # other advisories can be waived explicitly, with a written reason and a
      # recheck date, instead of forcing the wrong trade. Anything not on that
      # allowlist still fails. See the script's docblock.
      - name: npm audit (frontend-react)
        working-directory: frontend-react
        run: node scripts/audit-gate.mjs

      # Sidecar (bun) — same high+ gate against the bun lockfile.
      - name: bun audit (CinderpawAgent)
        working-directory: CinderpawAgent
        run: bun audit --audit-level=high
