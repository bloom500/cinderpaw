name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }} / ${{ matrix.step.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        step:
          - name: feral-agent
            workdir: FeralAgent
            install: bun install
            typecheck: bun run typecheck
            test: bun test
          - name: frontend-react
            workdir: frontend-react
            install: npm ci
            typecheck: npm run typecheck
            test: npm test -- --run

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: ${{ matrix.step.workdir }}
        run: ${{ matrix.step.install }}

      - name: Typecheck
        working-directory: ${{ matrix.step.workdir }}
        run: ${{ matrix.step.typecheck }}

      - name: Test
        working-directory: ${{ matrix.step.workdir }}
        run: ${{ matrix.step.test }}

  # The Rust half (src-tauri + crates/*) used to be compiled for the first time
  # by the tagged release build itself — a compile error there meant deleting
  # and re-pushing the tag. This job builds and tests it on every push instead.
  #
  # Default features only: no `inference-*`, so no Vulkan/CUDA SDK and no
  # llama.cpp compile. The GPU backends stay release-only.
  #
  # src-tauri's build script resolves `frontendDist` and `externalBin`, so the
  # frontend bundle and the sidecar binary must exist before cargo runs — the
  # same prerequisites release.yml installs, minus the bundling.
  rust:
    name: rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl \
            wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev cmake libclang-dev clang

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2

      - name: Install sidecar dependencies
        working-directory: FeralAgent
        run: bun install

      # Produces src-tauri/binaries/feral-agent-<target-triple> (externalBin).
      - name: Build sidecar
        working-directory: src-tauri
        run: node scripts/build-sidecar.mjs

      # Produces frontend-react/dist (frontendDist).
      - name: Build frontend
        working-directory: frontend-react
        run: npm ci && npm run build

      - name: cargo test
        run: cargo test --workspace

  # The headless/server build (`cargo build -p feral-cli --no-default-features`)
  # compiles the cfg(not(feature = "inference")) stubs that no other job
  # touches — this check exists because that path shipped broken once
  # (E0271 in the stream_chat stub). Cheap: no llama.cpp, no GUI deps.
  headless-cli:
    name: headless-cli (no-default-features)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libdbus-1-dev cmake

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2

      - name: cargo check (headless CLI)
        run: cargo check --release -p feral-cli --no-default-features

  # Dependency vulnerability scanning (M-3). Fails the build on known
  # advisories so a vulnerable transitive dep can't slip into a release.
  security-audit:
    name: security-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Prebuilt cargo-audit binary (no source compile) for the RustSec DB.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Rust deps — fails on RustSec vulnerability advisories. Uses the
      # committed Cargo.lock at the workspace root.
      - name: cargo audit
        run: cargo audit

      # Frontend (npm) — gate on high+ severity only to avoid dev-only noise.
      - name: npm audit (frontend-react)
        working-directory: frontend-react
        run: npm audit --omit=dev --audit-level=high

      # Sidecar (bun) — same high+ gate against the bun lockfile.
      - name: bun audit (FeralAgent)
        working-directory: FeralAgent
        run: bun audit --audit-level=high
