name: Publish cinderpaw-agent to npm

# Decoupled from the desktop app's `Release` workflow (which fires on `v*`).
# The CLI ships on its own cadence, on a dedicated tag (`cinderpaw-agent-v*`) or a
# manual run.
#
# Cross-platform distribution (esbuild/swc pattern): the `platform` matrix builds
# each OS/arch's two binaries (Rust `cinderpaw-cli` + Bun sidecar), assembles a
# per-platform package `cinderpaw-agent-<os>-<arch>` (with `os`/`cpu` set), and
# publishes it. The `main` job then publishes the umbrella `cinderpaw-agent` package,
# which lists all four as optionalDependencies — npm installs only the one that
# matches the user's machine. See CinderpawAgent/bin/cinderpaw.js for the runtime shim.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + npm pack only (do not publish)"
        type: boolean
        default: true
  push:
    tags:
      - "cinderpaw-agent-v*"

permissions:
  contents: read
  id-token: write # required for npm provenance (supply-chain attestation)

jobs:
  platform:
    name: ${{ matrix.pkg }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: cinderpaw-agent-win32-x64
            os: windows-2022
            node_os: win32
            node_arch: x64
            bun_target: bun-windows-x64
            binext: ".exe"
          - pkg: cinderpaw-agent-darwin-arm64
            os: macos-latest
            node_os: darwin
            node_arch: arm64
            bun_target: bun-darwin-arm64
            binext: ""
          # Intel mac is cross-compiled from the Apple Silicon runner (mirrors the
          # desktop Release workflow — no native x86_64 macOS runner is available).
          - pkg: cinderpaw-agent-darwin-x64
            os: macos-latest
            node_os: darwin
            node_arch: x64
            bun_target: bun-darwin-x64
            rust_target: x86_64-apple-darwin
            binext: ""
          - pkg: cinderpaw-agent-linux-x64
            os: ubuntu-22.04
            node_os: linux
            node_arch: x64
            bun_target: bun-linux-x64
            binext: ""
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      # cinderpaw-cli with --no-default-features drops the bundled llama.cpp engine,
      # so there is NO cmake / libclang / CUDA / Vulkan toolchain to install — the
      # npm CLI is a gateway/headless client, not a local inference engine. The
      # only native dep left is the keyring crate (libdbus) + openssl on Linux.
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev libdbus-1-dev

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG="$(node -p "require('./CinderpawAgent/package.json').version")"
          TAG="${GITHUB_REF_NAME#cinderpaw-agent-v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME ($TAG) != CinderpawAgent/package.json ($PKG)"; exit 1
          fi

      - name: Build cinderpaw-cli (Rust, no local inference)
        run: |
          if [ -n "${{ matrix.rust_target }}" ]; then
            cargo build --release -p cinderpaw-cli --no-default-features --target ${{ matrix.rust_target }}
            echo "CLI=target/${{ matrix.rust_target }}/release/cinderpaw-cli${{ matrix.binext }}" >> "$GITHUB_ENV"
          else
            cargo build --release -p cinderpaw-cli --no-default-features
            echo "CLI=target/release/cinderpaw-cli${{ matrix.binext }}" >> "$GITHUB_ENV"
          fi

      # The chat window and the setup wizard (`cinderpaw`, `cinderpaw chat`,
      # `cinderpaw setup --classic`) are the Go TUI. Without it the CLI tells
      # the user the chat "isn't bundled", so a CLI release without this step
      # has no chat at all. Pure Go, CGO off: every target cross-compiles.
      - uses: actions/setup-go@v5
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum

      - name: Build TUI (Go)
        working-directory: tui
        env:
          CGO_ENABLED: "0"
        run: |
          case "${{ matrix.node_os }}" in win32) GOOS=windows ;; *) GOOS=${{ matrix.node_os }} ;; esac
          case "${{ matrix.node_arch }}" in x64) GOARCH=amd64 ;; *) GOARCH=${{ matrix.node_arch }} ;; esac
          GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags "-s -w" -o "cinderpaw-tui${{ matrix.binext }}" .

      - name: Build sidecar (Bun --compile)
        working-directory: CinderpawAgent
        run: |
          bun install --frozen-lockfile
          bun build src/index.ts --compile --target=${{ matrix.bun_target }} --outfile dist/cinderpaw-agent

      # The one-command install (scripts/install.sh / install.ps1) downloads
      # these. Flat archive: the three binaries, named as find_binary expects.
      - name: Archive for the one-command install
        run: |
          case "${{ matrix.node_os }}" in win32) OSN=windows ;; darwin) OSN=macos ;; *) OSN=linux ;; esac
          NAME="cinderpaw-$OSN-${{ matrix.node_arch }}"
          mkdir -p "stage/$NAME" out
          cp "$CLI" "stage/$NAME/cinderpaw${{ matrix.binext }}"
          cp "CinderpawAgent/dist/cinderpaw-agent${{ matrix.binext }}" "stage/$NAME/"
          cp "tui/cinderpaw-tui${{ matrix.binext }}" "stage/$NAME/"
          if [ "$OSN" = windows ]; then
            (cd "stage/$NAME" && 7z a -tzip "../../out/$NAME.zip" . >/dev/null)
          else
            tar -czf "out/$NAME.tar.gz" -C "stage/$NAME" .
          fi
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.node_os }}-${{ matrix.node_arch }}
          path: out/*
          if-no-files-found: error

      - name: Assemble per-platform package
        working-directory: CinderpawAgent
        run: |
          node npm/assemble.mjs \
            --os ${{ matrix.node_os }} --arch ${{ matrix.node_arch }} \
            --cli "../$CLI" --agent "dist/cinderpaw-agent${{ matrix.binext }}" \
            --tui "../tui/cinderpaw-tui${{ matrix.binext }}"

      - name: Publish (or pack on dry run)
        working-directory: CinderpawAgent/npm/dist/${{ matrix.pkg }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.dry_run }}" = "false" ]; then
            # Idempotent: a version that is already on the registry (e.g. a
            # partial-publish retry where sibling packages went through) is not
            # a failure. Any OTHER error (spam block, auth, provenance) still fails.
            set +e
            OUT=$(npm publish --access public --provenance 2>&1); CODE=$?
            echo "$OUT"
            if [ $CODE -ne 0 ] && echo "$OUT" | grep -qiE 'cannot publish over|previously published|409 Conflict'; then
              echo "::notice::${{ matrix.pkg }} already published at this version — treating as success"
              exit 0
            fi
            exit $CODE
          else
            npm pack --dry-run
          fi

  # Spec 2026-09-24 §8.1: the real one-command install on clean runners,
  # against the archives this run just built, served from localhost.
  install-smoke:
    name: install smoke (${{ matrix.os }})
    needs: platform
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-latest, ubuntu-22.04]
    env:
      CINDERPAW_NO_BROWSER: "1"
      CINDERPAW_DOWNLOAD_BASE: http://127.0.0.1:8765
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: serve
          merge-multiple: true
      - name: Checksums
        run: |
          cd serve
          if command -v sha256sum >/dev/null; then sha256sum * > SHA256SUMS; else shasum -a 256 * > SHA256SUMS; fi
          cat SHA256SUMS

      # The file server starts in the SAME step as the install: the macOS
      # runner kills background processes when a step ends.

      - name: Install (unix), twice
        if: runner.os != 'Windows'
        run: |
          (cd serve && exec python3 -m http.server 8765 >/dev/null 2>&1) &
          sleep 3
          bash scripts/install.sh | tee first.log
          grep -q 'All set!' first.log
          bash scripts/install.sh | tee second.log   # engine is up: must update, not fail
          grep -q 'All set!' second.log
      - name: Install (Windows), twice, through iex like a person would
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process python -ArgumentList '-m','http.server','8765' -WorkingDirectory serve -WindowStyle Hidden
          Start-Sleep 3
          foreach ($n in 1,2) {
            $out = powershell -NoProfile -Command "Get-Content -Raw scripts\install.ps1 | iex" | Out-String
            Write-Host $out
            if ($out -notmatch 'All set!') { throw "run $n did not finish" }
          }

      - name: Assert the footprint
        shell: pwsh
        run: |
          $d = Join-Path $HOME '.cinderpaw'
          $ext = if ($IsWindows) { '.exe' } else { '' }
          foreach ($f in 'cinderpaw','cinderpaw-agent','cinderpaw-tui') {
            if (-not (Test-Path (Join-Path $d "bin/$f$ext"))) { throw "missing $f" }
          }
          if ($IsWindows) {
            $p = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs"
            foreach ($l in "$p\Startup\Cinderpaw.lnk", "$p\Cinderpaw.lnk") { if (-not (Test-Path $l)) { throw "missing $l" } }
            if ((Get-Item 'HKCU:\Environment').GetValue('Path') -notlike "*$d\bin*") { throw 'PATH not set' }
          } elseif ($IsMacOS) {
            foreach ($l in "$HOME/Library/LaunchAgents/dev.cinderpaw.engine.plist", "$HOME/Applications/Cinderpaw.app/Contents/MacOS/cinderpaw-open") { if (-not (Test-Path $l)) { throw "missing $l" } }
            codesign -v "$d/bin/cinderpaw-agent"; if ($LASTEXITCODE) { throw 'sidecar signature invalid' }
          } else {
            if (-not (Test-Path "$HOME/.local/share/applications/cinderpaw.desktop")) { throw 'missing shortcut' }
            if (-not ((Test-Path "$HOME/.config/systemd/user/cinderpaw.service") -or (Test-Path "$HOME/.config/autostart/cinderpaw.desktop"))) { throw 'missing autostart' }
          }
          # Engine healthy: Cinderpaw answers on its port with its own token.
          $tok = (Get-Content (Join-Path $d 'api-token')).Trim()
          Invoke-RestMethod -Headers @{ Authorization = "Bearer $tok" } http://127.0.0.1:11435/runtime/status | Out-Null

      - name: Uninstall --purge, then nothing is left
        shell: pwsh
        run: |
          $ext = if ($IsWindows) { '.exe' } else { '' }
          & (Join-Path $HOME ".cinderpaw/bin/cinderpaw$ext") uninstall --purge --yes
          Start-Sleep 8   # Windows removes the folder after the command exits
          $left = @((Join-Path $HOME '.cinderpaw'))
          if ($IsWindows) {
            $p = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs"
            $left += "$p\Startup\Cinderpaw.lnk", "$p\Cinderpaw.lnk"
            if ((Get-Item 'HKCU:\Environment').GetValue('Path') -like '*.cinderpaw*') { throw 'PATH entry left' }
          } elseif ($IsMacOS) {
            $left += "$HOME/Library/LaunchAgents/dev.cinderpaw.engine.plist", "$HOME/Applications/Cinderpaw.app"
          } else {
            $left += "$HOME/.local/share/applications/cinderpaw.desktop", "$HOME/.config/systemd/user/cinderpaw.service", "$HOME/.config/autostart/cinderpaw.desktop"
          }
          foreach ($l in $left) { if (Test-Path $l) { throw "left behind: $l" } }
          foreach ($rc in '.zshrc','.bashrc','.bash_profile','.profile') {
            $f = Join-Path $HOME $rc
            if ((Test-Path $f) -and (Select-String -Path $f -SimpleMatch '>>> cinderpaw >>>' -Quiet)) { throw "PATH block left in $rc" }
          }

  # Attach the archives to a GitHub release for this tag. NEVER "latest": the
  # Desktop updater reads releases/latest/download/latest.json, and a CLI
  # release there would leave every Desktop install unable to update.
  github-release:
    name: GitHub release (archives)
    needs: [platform, install-smoke]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: out
          merge-multiple: true
      - name: Create or update the release
        run: |
          cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" * --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" * -R "$GITHUB_REPOSITORY" --latest=false \
              --title "Cinderpaw CLI ${TAG#cinderpaw-agent-v}" \
              --notes "One-command install: see cinderpaw.dev/app. Checksums in SHA256SUMS."
          fi
      - name: The Desktop still owns "latest"
        run: |
          LATEST="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name || true)"
          echo "latest = $LATEST"
          case "$LATEST" in cinderpaw-agent-v*) echo "::error::CLI release became latest"; exit 1 ;; esac

  # Umbrella package: the `cinderpaw` bin + the optionalDependencies that point npm at
  # the per-platform packages published above. No binaries of its own.
  main:
    name: cinderpaw-agent (umbrella)
    needs: platform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CinderpawAgent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#cinderpaw-agent-v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME ($TAG) != package.json ($PKG)"; exit 1
          fi

      # Pin every optionalDependency to this exact version, so the umbrella never
      # references a platform package that wasn't published in this same run.
      - name: Sync optionalDependencies to package version
        run: |
          node -e '
            const fs = require("fs");
            const p = require("./package.json");
            const v = p.version;
            for (const k of Object.keys(p.optionalDependencies || {})) p.optionalDependencies[k] = v;
            fs.writeFileSync("./package.json", JSON.stringify(p, null, 2) + "\n");
            console.log("optionalDependencies pinned to", v);
          '

      - name: Publish (or pack on dry run)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.dry_run }}" = "false" ]; then
            set +e
            OUT=$(npm publish --access public --provenance 2>&1); CODE=$?
            echo "$OUT"
            if [ $CODE -ne 0 ] && echo "$OUT" | grep -qiE 'cannot publish over|previously published|409 Conflict'; then
              echo "::notice::cinderpaw-agent already published at this version — treating as success"
              exit 0
            fi
            exit $CODE
          else
            npm pack --dry-run
          fi
