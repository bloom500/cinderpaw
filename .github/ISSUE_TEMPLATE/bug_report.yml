name: Bug report
description: Something broke or didn't behave as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time! If you installed Cinderpaw with the one-line
        terminal command, the `cinderpaw doctor` output below answers most of our
        first questions, so please include it.

        Only have the desktop app? You can also report from inside it:
        Settings → About → Report a bug. It can attach the last lines of the app
        log, and shows them to you before anything is sent.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
      placeholder: I clicked … and expected … but got …
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Diagnostic output
      description: |
        Run `cinderpaw doctor` in a terminal and paste the output here.
        The desktop app alone does not add the `cinderpaw` command. In that case,
        tell us your OS, how you installed Cinderpaw, and whether you use a local
        model or a cloud key. The last lines of the app log help too:
        `~/.cinderpaw/logs/cinderpaw.log` (Windows: `%USERPROFILE%\.cinderpaw\logs\cinderpaw.log`).
        Check them for anything private before you paste.
      render: text
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Cinderpaw version
      description: Settings → General → App version, or `cinderpaw --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 10/11
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, logs, the model you were using, etc.
